<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="styles/tic-tac-toe.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tic tac toe</title>
</head>
<body>
 

    

    <main class="game">
       <div style="margin-bottom: 56px;">
      <h2 class="winner hide"></h2>  
  </div>
    <h1>Tic Tac Toe</h1>

    <p id="status">Player X's turn</p>

    <div class="board" id="board">
      <button class="cell" data-index="0"></button>
      <button class="cell" data-index="1"></button>
      <button class="cell" data-index="2"></button>
      <button class="cell" data-index="3"></button>
      <button class="cell" data-index="4"></button>
      <button class="cell" data-index="5"></button>
      <button class="cell" data-index="6"></button>
      <button class="cell" data-index="7"></button>
      <button class="cell" data-index="8"></button>
    </div>

    <button id="restart" class="restart">Restart</button>



      <div class="scoreboard">
        <p>X wins: <span id="score-x"></span></p>
        <p>O wins: <span id="score-o"></span></p>
      </div>


    
  </main>
   



    <script src="scripts/tic-tac-toe.js"></script>
</body>
</html>
