<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Games</title>

  <style>
    :root {
      --bg: #0f1020;
      --card: #1c1e3a;
      --accent: #7c5cff;
      --text: #f2f2ff;
      --muted: #9a9cc0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #23254d, var(--bg));
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3rem 1rem;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 6vw, 3.5rem);
      letter-spacing: 0.04em;
    }

    header p {
      color: var(--muted);
      margin-top: 0.5rem;
    }

    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 240px));
      gap: 1.5rem;
      justify-content: center;
      width: 100%;
      max-width: 900px;
    }

    .game-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      padding: 2rem 1rem;
      background: var(--card);
      border: 2px solid transparent;
      border-radius: 16px;
      color: var(--text);
      text-decoration: none;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .game-card:hover,
    .game-card:focus-visible {
      transform: translateY(-6px);
      border-color: var(--accent);
      box-shadow: 0 10px 30px rgba(124, 92, 255, 0.35);
      outline: none;
    }

    .game-icon {
      font-size: 2.5rem;
    }

    .game-title {
      font-size: 1.25rem;
      font-weight: 600;
    }
  </style>
</head>

<body>
  <header>
    <h1>Game Arcade</h1>
    <p>Pick a game. Lose gracefully.</p>
  </header>

  <main class="game-grid">
    <a class="game-card" href="tic-tac-toe.html">
      <span class="game-icon">❌⭕</span>
      <span class="game-title">Tic Tac Toe</span>
    </a>
  </main>
</body>
</html>
